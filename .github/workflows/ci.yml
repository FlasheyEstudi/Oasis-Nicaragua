name: Oasis Nicaragua CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Configurar Node.js (v20)
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: Backend/package-lock.json

    - name: Instalar dependencias del Backend
      run: |
        cd Backend
        npm ci

    - name: Validar esquema de Prisma
      run: |
        cd Backend
        DATABASE_URL="postgresql://postgres:postgres@localhost:5432/oasis?schema=public" npx prisma validate

    - name: Ejecutar Linter
      run: |
        cd Backend
        npm run lint

    - name: Verificación de TypeScript (Type-Check)
      run: |
        cd Backend
        npx tsc --noEmit

    - name: Compilar aplicación (Build Next.js)
      run: |
        cd Backend
        npx prisma generate
        npm run build
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/oasis?schema=public"
        NODE_ENV: production
